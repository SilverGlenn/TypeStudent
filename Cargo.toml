[package]
name = "type_student"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = "0.4"
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
tts = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

